name: Build BatteryUKRM-RH

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync approved BatteryUKRM icons
        run: |
          mkdir -p prefs/Resources
          curl -fL "https://raw.githubusercontent.com/ttlongdl/BatteryUKRM/main/prefs/Resources/icon.png" -o prefs/Resources/icon.png
          curl -fL "https://raw.githubusercontent.com/ttlongdl/BatteryUKRM/main/prefs/Resources/icon@2x.png" -o prefs/Resources/icon@2x.png
          curl -fL "https://raw.githubusercontent.com/ttlongdl/BatteryUKRM/main/prefs/Resources/icon@3x.png" -o prefs/Resources/icon@3x.png
          file prefs/Resources/icon*.png
          shasum -a 256 prefs/Resources/icon*.png

      - name: Install Roothide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install signing tool
        run: |
          brew install ldid
          which ldid
          ldid -v || true

      - name: Build Roothide package
        run: |
          make clean package FINALPACKAGE=1
          ls -lah packages/

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: BatteryUKRM-RH-1.1.0
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 7
